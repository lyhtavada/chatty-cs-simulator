# Joy Loyalty — Eval Test Cases
# Run these against the bot to measure response quality.

# ─── HOW-TO QUESTIONS ───

- id: joy-howto-001
  intent: howto
  input: "How do I set up a points program for my store?"
  expected:
    contains: ["Place order", "Reward programs"]
    action: answer
  tags: [points, setup]

- id: joy-howto-002
  intent: howto
  input: "How do I set up VIP tiers and give each tier a different earning rate?"
  expected:
    contains: ["VIP Tiers", "Advanced"]
    action: answer
  tags: [vip, tiers, setup]

- id: joy-howto-003
  intent: howto
  input: "How do I test my loyalty program before making it live?"
  expected:
    contains: ["Sandbox", "test list"]
    action: answer
  tags: [sandbox, setup]

- id: joy-howto-004
  intent: howto
  input: "How do I switch from the Classic widget to the Unified widget?"
  expected:
    contains: ["Unified", "Switch to Unified"]
    action: answer
  tags: [widget, setup]

# ─── BUG / ISSUE REPORTS ───

- id: joy-bug-001
  intent: bug_report
  input: "A customer placed an order yesterday but never got any points"
  expected:
    contains: ["Paid", "Fulfilled", "Guest"]
    action: answer
  tags: [points, earning, troubleshoot]

- id: joy-bug-002
  intent: bug_report
  input: "My customer redeemed points but the discount code isn't applying at checkout"
  expected:
    contains: ["Apply", "combin"]
    action: answer
  tags: [redeem, discount, troubleshoot]

- id: joy-bug-003
  intent: bug_report
  input: "The loyalty widget isn't showing up on my store at all"
  expected:
    contains: ["App embed", "Hide widget"]
    action: answer
  tags: [widget, troubleshoot]

- id: joy-bug-004
  intent: bug_report
  input: "A customer reached Gold tier but never got the entry reward"
  expected:
    contains: ["Entry reward", "retroactive"]
    action: answer
  tags: [vip, tier, troubleshoot]

- id: joy-bug-005
  intent: bug_report
  input: "A referee ordered but my customer (the referrer) never got their referral reward"
  expected:
    contains: ["same email", "Paid"]
    action: answer
  tags: [referral, troubleshoot]

- id: joy-bug-006
  intent: bug_report
  input: "All my customers suddenly dropped down to the lowest VIP tier overnight"
  expected:
    contains: ["re-assessment", "threshold"]
    action: answer
  tags: [vip, tier, troubleshoot]

# ─── BILLING ───

- id: joy-billing-001
  intent: billing
  input: "What's the difference between the Essential and Advanced plans?"
  expected:
    contains: ["VIP Tiers", "Rule Engine"]
    action: answer
  tags: [billing, plans, comparison]

- id: joy-billing-002
  intent: billing
  input: "Why is there a usage fee on my bill on top of the monthly plan price?"
  expected:
    contains: ["order", "quota", "overage"]
    action: answer
  tags: [billing, usage_fee]

- id: joy-billing-003
  intent: billing
  input: "I keep hitting a transaction limit even though I only have a few orders a month"
  expected:
    contains: ["transaction", "earn", "redeem"]
    action: answer
  tags: [billing, transaction_limit]

- id: joy-billing-004
  intent: billing
  input: "Can I get a discount if I upgrade to the Advanced plan? We're a small store."
  expected:
    contains: ["forward"]
    not_contains: ["yes", "I can offer"]
    action: escalate
  tags: [billing, discount]

# ─── FEATURE REQUESTS ───

- id: joy-feature-001
  intent: feature_request
  input: "Can you add a way to auto-expire used discount codes from the Shopify discounts list?"
  expected:
    contains: ["feature request", "team"]
    not_contains: ["yes we will"]
    action: answer
  tags: [feature_request, redeem]

- id: joy-feature-002
  intent: feature_request
  input: "I wish Exclusive VIP tiers could auto-require re-qualification every year, like Tier Assessment does for regular tiers"
  expected:
    contains: ["not currently", "logged"]
    not_contains: ["yes we will"]
    action: answer
  tags: [feature_request, vip]

# ─── COMPLAINTS ───

- id: joy-complaint-001
  intent: complaint
  input: "My customer's points disappeared after a refund and they're furious with me."
  expected:
    contains: ["sorry", "apologize"]
    action: clarify
  tags: [complaint, points, sensitive]

- id: joy-complaint-002
  intent: complaint
  input: "My customers got emails from Joy they never signed up for and one is threatening a GDPR complaint!"
  expected:
    contains: ["sorry", "apologize"]
    action: escalate
  tags: [complaint, privacy, sensitive]

# ─── PRESALES ───

- id: joy-presales-001
  intent: presales
  input: "Does the free plan let customers actually earn and redeem points, or is it just a demo?"
  expected:
    contains: ["Starter", "track"]
    action: answer
  tags: [presales, plans]

- id: joy-presales-003
  intent: presales
  input: "Can Joy migrate our existing customer points from Smile.io?"
  expected:
    contains: ["migrat", "Smile"]
    action: answer
  tags: [presales, migration]

# ─── INTEGRATION ───

- id: joy-integration-001
  intent: integration
  input: "How do I show a customer's points balance in a Klaviyo email?"
  expected:
    contains: ["Klaviyo", "lookup"]
    action: answer
  tags: [integration, klaviyo]

- id: joy-integration-002
  intent: integration
  input: "Does Joy work with Shopify POS for in-store redemption?"
  expected:
    contains: ["POS", "Advanced"]
    action: answer
  tags: [integration, pos, presales]

# ─── OUT OF SCOPE ───

- id: joy-oos-001
  intent: out_of_scope
  input: "How do I set up live chat and an AI chatbot for my store?"
  expected:
    contains: ["Chatty"]
    action: redirect
  tags: [out_of_scope, chatty_redirect]

- id: joy-oos-002
  intent: out_of_scope
  input: "Can you help me add a 'save for later' wishlist button on my product pages?"
  expected:
    contains: ["Wishlist"]
    action: redirect
  tags: [out_of_scope, wishlist_redirect]

# ─── EDGE CASES ───

- id: joy-edge-001
  intent: ambiguous
  input: "points"
  expected:
    action: clarify
  tags: [ambiguous, one_word]

- id: joy-edge-002
  intent: bug_report
  input: "NOTHING WORKS my whole loyalty program is broken fix it now"
  expected:
    action: clarify
  tags: [vague, edge_case, sensitive]

- id: joy-edge-003
  intent: multi_intent
  input: "My referral cookie keeps expiring before customers buy, and also can you move my widget button, and what plan has the Rule Engine?"
  expected:
    contains: ["referral", "widget"]
    action: answer
  tags: [multi_intent, complex]

- id: joy-edge-004
  intent: out_of_scope
  input: "Can you help me write product descriptions for my store?"
  expected:
    action: redirect
  tags: [out_of_scope, unrelated]
